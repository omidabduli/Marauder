<!--
  MARAUDER - ADMIN SETTINGS
  Written / Maintained by: OA (Omid Abduli)

  Password-protected settings: language, past-week edit lock and limit, number of
  future week pairs, and the admin password. Without the server (demo on GitHub Pages)
  the same form keeps its settings in this browser; the demo password is "admin".
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marauder · Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141413'/%3E%3Crect x='7' y='13' width='6' height='6' rx='1.5' fill='%237BB287'/%3E%3Ccircle cx='19' cy='16' r='3' fill='%23E3BF55'/%3E%3Cpath d='M25 12.5l3 6h-6z' fill='%23E0675A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF9F5; --surface:#F0EEE6; --raised:#FFFFFF;
  --ink:#141413; --ink-2:#3D3D3A; --muted:#6E6C64; --line:#E3DFD3;
  --clay:#C15F3C; --clay-ink:#A94F2F; --clay-soft:#F4E2D8;
  --sea:#44697A; --sea-soft:#DDE7EA;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1B19; --surface:#252420; --raised:#2B2A26;
    --ink:#F0EEE6; --ink-2:#D3D0C6; --muted:#A19E94; --line:#3A3833;
    --clay:#E08A67; --clay-ink:#E9A083; --clay-soft:#3A2A22;
    --sea:#93B4C2; --sea-soft:#233036;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1B19; --surface:#252420; --raised:#2B2A26;
  --ink:#F0EEE6; --ink-2:#D3D0C6; --muted:#A19E94; --line:#3A3833;
  --clay:#E08A67; --clay-ink:#E9A083; --clay-soft:#3A2A22;
  --sea:#93B4C2; --sea-soft:#233036;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.top{border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-size:22px;text-decoration:none}
.back{font-size:14px;color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px}
.back:hover{background:var(--surface);color:var(--ink)}

main{max-width:560px;margin:0 auto;padding:clamp(40px,8vw,88px) 16px 80px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(36px,6vw,50px);line-height:1.08;margin:12px 0 28px}
h2{font-size:22px;line-height:1.2;margin-bottom:16px}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:28px 0 8px}
.f{display:grid;gap:6px;margin-bottom:20px}
.f label,.check label{font-size:14px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--muted)}
.field{height:42px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:0 14px;font-size:15px}
.field:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
.field:disabled{opacity:.5}
.check{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.check input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.btn{display:inline-flex;align-items:center;height:42px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:500;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:var(--clay);border-color:var(--clay)}
.actions{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap}
.msg{font-size:14px;padding:10px 14px;border-radius:12px;margin-bottom:24px}
.msg.ok{background:var(--sea-soft);color:var(--sea)}
.msg.err{background:var(--clay-soft);color:var(--clay-ink)}
.note{font-size:14px;color:var(--ink-2);background:var(--surface);border-radius:14px;padding:12px 16px;margin-bottom:28px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="./">Marauder</a>
  <a class="back" id="topBack" href="/"></a>
</div></header>

<main>
  <p class="eyebrow">Admin</p>

  <section id="loginCard">
    <h1 id="loginTitle"></h1>
    <p class="note" id="demoNote" hidden></p>
    <p class="msg err" id="loginMessage" hidden></p>
    <form id="loginForm">
      <div class="f">
        <label for="loginPassword" id="labelLoginPassword"></label>
        <input class="field" type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="actions"><button class="btn" type="submit" id="btnLogin"></button></div>
    </form>
  </section>

  <section id="settingsCard" hidden>
    <h1 id="settingsTitle"></h1>
    <p class="msg" id="settingsMessage" hidden></p>
    <form id="settingsForm">
      <fieldset>
        <div class="f">
          <label for="language" id="labelLanguage"></label>
          <select class="field" id="language">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <div class="check">
          <input type="checkbox" id="allowPastChanges" checked>
          <label for="allowPastChanges" id="labelAllowPast"></label>
        </div>
        <div class="f">
          <label for="pastWeeksLimit" id="labelPastLimit"></label>
          <input class="field" type="number" id="pastWeeksLimit" min="0" max="20" placeholder="8">
        </div>
        <div class="f">
          <label for="futurePeriods" id="labelFuturePeriods"></label>
          <input class="field" type="number" id="futurePeriods" min="0" max="10" placeholder="1" required>
        </div>
      </fieldset>

      <fieldset>
        <h2 id="labelChangePasswordHeader"></h2>
        <div class="f">
          <label for="newPassword" id="labelNewPassword"></label>
          <input class="field" type="password" id="newPassword" autocomplete="new-password">
        </div>
        <div class="f">
          <label for="confirmPassword" id="labelConfirmPassword"></label>
          <input class="field" type="password" id="confirmPassword" autocomplete="new-password">
        </div>
      </fieldset>

      <div class="actions"><button class="btn" type="submit" id="btnSave"></button></div>
    </form>
  </section>
</main>

<script>
const translations = {
  de: {
    loginTitle: "Anmelden", labelLoginPassword: "Admin-Passwort", btnLogin: "Einloggen",
    back: "Zurück zum Monitor", settingsTitle: "Einstellungen",
    labelLanguage: "Sprache", labelAllowPast: "Bearbeiten vergangener Wochen erlauben",
    labelPastLimit: "Wie viele Wochenpaare in der Vergangenheit können bearbeitet werden?",
    labelFuturePeriods: "Zukünftige Wochenpaare, die angezeigt werden",
    labelChangePasswordHeader: "Passwort ändern", labelNewPassword: "Neues Passwort",
    labelConfirmPassword: "Neues Passwort bestätigen", btnSave: "Speichern",
    saved: "Einstellungen gespeichert.", failed: "Fehler beim Speichern der Einstellungen: ",
    invalidLogin: "Falsches Admin-Passwort.", passwordsMismatch: "Die Passwörter stimmen nicht überein.",
    demoNote: "Demo: Das Passwort ist „admin“. Einstellungen werden nur in diesem Browser gespeichert."
  },
  en: {
    loginTitle: "Sign in", labelLoginPassword: "Admin password", btnLogin: "Sign in",
    back: "Back to the monitor", settingsTitle: "Settings",
    labelLanguage: "Language", labelAllowPast: "Allow editing past weeks",
    labelPastLimit: "How many past week pairs can be edited?",
    labelFuturePeriods: "Future week pairs to show",
    labelChangePasswordHeader: "Change password", labelNewPassword: "New password",
    labelConfirmPassword: "Confirm new password", btnSave: "Save settings",
    saved: "Settings saved.", failed: "Failed to save settings: ",
    invalidLogin: "Incorrect admin password.", passwordsMismatch: "The passwords do not match.",
    demoNote: "Demo: the password is “admin”. Settings are saved in this browser only."
  },
  fr: {
    loginTitle: "Connexion", labelLoginPassword: "Mot de passe admin", btnLogin: "Se connecter",
    back: "Retour au moniteur", settingsTitle: "Paramètres",
    labelLanguage: "Langue", labelAllowPast: "Autoriser la modification des semaines passées",
    labelPastLimit: "Combien de paires de semaines passées peuvent être modifiées ?",
    labelFuturePeriods: "Paires de semaines futures à afficher",
    labelChangePasswordHeader: "Changer le mot de passe", labelNewPassword: "Nouveau mot de passe",
    labelConfirmPassword: "Confirmer le nouveau mot de passe", btnSave: "Enregistrer",
    saved: "Paramètres enregistrés.", failed: "Échec de l'enregistrement des paramètres : ",
    invalidLogin: "Mot de passe admin incorrect.", passwordsMismatch: "Les mots de passe ne correspondent pas.",
    demoNote: "Démo : le mot de passe est « admin ». Les paramètres restent dans ce navigateur."
  },
  it: {
    loginTitle: "Accesso", labelLoginPassword: "Password amministratore", btnLogin: "Accedi",
    back: "Torna al monitor", settingsTitle: "Impostazioni",
    labelLanguage: "Lingua", labelAllowPast: "Consenti la modifica delle settimane passate",
    labelPastLimit: "Quante coppie di settimane passate possono essere modificate?",
    labelFuturePeriods: "Coppie di settimane future da mostrare",
    labelChangePasswordHeader: "Cambia password", labelNewPassword: "Nuova password",
    labelConfirmPassword: "Conferma nuova password", btnSave: "Salva impostazioni",
    saved: "Impostazioni salvate.", failed: "Impossibile salvare le impostazioni: ",
    invalidLogin: "Password amministratore errata.", passwordsMismatch: "Le password non corrispondono.",
    demoNote: "Demo: la password è “admin”. Le impostazioni restano in questo browser."
  }
};

const $ = id => document.getElementById(id);
const DEMO_SETTINGS_KEY = 'marauder-demo-settings';
const DEMO_DEFAULTS = { language: 'en', allowPastChanges: true, pastWeeksLimit: 8, futurePeriods: 1, adminPassword: 'admin' };
let DEMO = false;
let currentLanguage = 'de';
let activePassword = '';

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const session = {
  get() { try { return sessionStorage.getItem('adminPassword'); } catch { return null; } },
  set(v) { try { sessionStorage.setItem('adminPassword', v); } catch {} }
};
const demoSettings = () => ({ ...DEMO_DEFAULTS, ...(store.get(DEMO_SETTINGS_KEY) || {}) });

// Demo mode answers the same three calls the server would.
async function api(path, body) {
  if (DEMO) {
    const s = demoSettings();
    if (path === 'api/admin-login') return body.password === s.adminPassword ? { ok: true, data: {} } : { ok: false, data: {} };
    if (path === 'api/settings' && !body) { const { adminPassword, ...pub } = s; return { ok: true, data: pub }; }
    if (body.password !== s.adminPassword) return { ok: false, data: { message: 'Unauthorized' } };
    const next = { ...s };
    for (const k of ['language', 'allowPastChanges', 'pastWeeksLimit', 'futurePeriods']) if (k in body) next[k] = body[k];
    if (body.newPassword) next.adminPassword = body.newPassword;
    store.set(DEMO_SETTINGS_KEY, next);
    return { ok: true, data: {} };
  }
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store' });
  return { ok: res.ok, data: await res.json().catch(() => ({})) };
}

function applyLanguage(lang) {
  currentLanguage = translations[lang] ? lang : 'de';
  const t = translations[currentLanguage];
  document.documentElement.lang = currentLanguage;
  for (const id of ['loginTitle', 'labelLoginPassword', 'btnLogin', 'settingsTitle', 'labelLanguage', 'labelAllowPast',
    'labelPastLimit', 'labelFuturePeriods', 'labelChangePasswordHeader', 'labelNewPassword', 'labelConfirmPassword', 'btnSave']) $(id).textContent = t[id];
  $('topBack').textContent = t.back;
  $('demoNote').textContent = t.demoNote;
}

function show(el, text, kind) { el.textContent = text; el.className = 'msg ' + kind; el.hidden = false; }

const allowPast = $('allowPastChanges');
const pastLimit = $('pastWeeksLimit');
allowPast.addEventListener('change', () => { pastLimit.disabled = !allowPast.checked; if (!allowPast.checked) pastLimit.value = ''; });
$('language').addEventListener('change', e => applyLanguage(e.target.value));

async function loadSettings() {
  try {
    const { ok, data } = await api('api/settings');
    if (!ok) return;
    $('language').value = data.language || 'de';
    allowPast.checked = data.allowPastChanges !== false;
    pastLimit.disabled = !allowPast.checked;
    pastLimit.value = data.pastWeeksLimit ?? '';
    $('futurePeriods').value = data.futurePeriods ?? 1;
    applyLanguage(data.language || 'de');
  } catch (err) { console.error('Failed to load settings:', err); }
}

function openSettings() {
  $('loginCard').hidden = true;
  $('settingsCard').hidden = false;
  loadSettings();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('loginMessage');
  msg.hidden = true;
  const pwd = $('loginPassword').value;
  try {
    const { ok } = await api('api/admin-login', { password: pwd });
    if (ok) { activePassword = pwd; session.set(pwd); openSettings(); }
    else show(msg, translations[currentLanguage].invalidLogin, 'err');
  } catch (err) { show(msg, err.message, 'err'); }
});

$('settingsForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('settingsMessage');
  msg.hidden = true;
  const t = translations[currentLanguage];
  const newPassword = $('newPassword').value;
  if ((newPassword || $('confirmPassword').value) && newPassword !== $('confirmPassword').value) { show(msg, t.passwordsMismatch, 'err'); return; }

  const payload = {
    language: $('language').value,
    allowPastChanges: allowPast.checked,
    pastWeeksLimit: allowPast.checked && pastLimit.value !== '' ? parseInt(pastLimit.value) : null,
    futurePeriods: parseInt($('futurePeriods').value),
    password: activePassword
  };
  if (newPassword) payload.newPassword = newPassword;

  try {
    const { ok, data } = await api('api/settings', payload);
    if (ok) {
      show(msg, t.saved, 'ok');
      if (newPassword) { activePassword = newPassword; session.set(newPassword); $('newPassword').value = ''; $('confirmPassword').value = ''; }
      setTimeout(() => { msg.hidden = true; }, 3000);
    } else show(msg, t.failed + (data.message || data.error || ''), 'err');
  } catch (err) { show(msg, t.failed + err.message, 'err'); }
});

(async () => {
  // Same check as the monitor: no JSON from api/settings means there is no server behind this page.
  try {
    const res = await fetch('api/settings', { cache: 'no-store' });
    DEMO = !(res.ok && (res.headers.get('content-type') || '').includes('json'));
    if (!DEMO) applyLanguage((await res.json()).language || 'de');
  } catch { DEMO = true; }
  if (DEMO) {
    applyLanguage(demoSettings().language);
    $('demoNote').hidden = false;
    $('topBack').href = 'app.html';
  }
  const stored = session.get();
  if (stored) { activePassword = stored; openSettings(); }
})();
</script>
</body>
</html>
